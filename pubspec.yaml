name: harmony_music
description: A premium music streaming application
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  animations: ^2.0.11
  carousel_slider: ^5.0.0
  flutter_staggered_animations: ^1.1.1
  shimmer: ^3.0.0
  lottie: ^3.1.0
  rive: ^0.13.0
  font_awesome_flutter: ^11.0.0

  just_audio: ^0.9.36
  audio_session: ^0.1.21
  rxdart: ^0.28.0
  just_audio_background: ^0.0.1-beta.12

  firebase_core: ^3.6.0
  firebase_auth: ^5.3.0
  cloud_firestore: ^5.4.0
  firebase_storage: ^12.3.0
  google_sign_in: ^6.2.1
  sign_in_with_apple: ^6.1.3

  hive: ^2.2.3
  hive_flutter: ^1.1.0
  shared_preferences: ^2.3.2

  dio: ^5.7.0
  http: ^1.2.2
  cached_network_image: ^3.4.1
  connectivity_plus: ^6.0.5

  path_provider: ^2.1.4
  url_launcher: ^6.3.1
  permission_handler: ^11.3.1
  file_picker: ^8.1.2
  image_picker: ^1.1.2
  share_plus: ^10.0.2
  equatable: ^2.0.7
  crypto: ^3.0.3

  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2
  provider: ^6.1.5+1
  palette_generator: ^0.3.3+7
  flutter_cache_manager: ^3.4.0
  firebase_messaging: ^15.1.3
  flutter_local_notifications: ^18.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: "ic_launcher"
  ios: true
  image_path: "assets/icons/app_icon.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true
  assets:
    - assets/animations/
    - assets/images/
    - assets/icons/